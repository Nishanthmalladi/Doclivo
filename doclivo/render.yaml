# Render Blueprint: Render reads this file and sets the site up for you.
# Dashboard -> New -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: doclivo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Free plan: 512 MB memory, so one job at a time and smaller files.
      - key: WORKERS
        value: "1"
      - key: QUEUE_WAIT
        value: "120"
      - key: MAX_FILE_MB
        value: "15"
      - key: MAX_TOTAL_MB
        value: "40"
      - key: MAX_FILES
        value: "15"
      - key: MAX_PAGES
        value: "80"
      - key: MAX_PAGES_DOCX
        value: "30"
      - key: JOB_TIMEOUT
        value: "300"
      - key: OFFICE_TIMEOUT
        value: "270"
      - key: RATE_PER_MINUTE
        value: "20"
      - key: RATE_PER_HOUR
        value: "150"
      # Render's edge network passes on the visitor's address.
      - key: PROXY
        value: cloudflare
      - key: SITE_NAME
        value: Doclivo
      # Required by the AGPL licence: the link to your public GitHub repository.
      - key: SOURCE_URL
        sync: false
